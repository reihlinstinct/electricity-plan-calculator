name: Accessibility
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  a11y:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Pinned shared accessibility tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: reihlinstinct/repo-checks
          ref: 55f4c1155ef80421af0bf0cad2f296f2c3acd044
          path: .ci/repo-checks
          persist-credentials: false
      - name: Start synthetic local preview
        run: |
          node tests/a11y-preview.mjs preview > /tmp/zz-a11y-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if [ -f .a11y-routes.json ] && curl -fsS http://127.0.0.1:8765/web/index.html > /dev/null; then exit 0; fi
            sleep 1
          done
          echo 'Synthetic preview failed to start'
          exit 1
      - uses: ./.ci/repo-checks/actions/a11y
        with:
          base-url: http://127.0.0.1:8765/
          config: ${{ github.workspace }}/.a11y-routes.json
      - name: All pages and synthetic calculation states
        env:
          A11Y_TOOLS: ${{ github.workspace }}/.ci/repo-checks/actions/a11y
        run: node tests/a11y.mjs
      - name: Scope summary
        if: always()
        run: |
          printf '%s\n' '## Accessibility coverage' 'All catalog languages, three pages, Chromium/WebKit, desktop/mobile; synthetic CSV calculation states.' 'Guide screenshots are synthetic placeholders with the original dimensions. Real screenshot content, manual keyboard/screen-reader/device checks and chart alternatives still need review.' 'Synthetic/no-secret previews only, not network isolation or SI 5568 certification.' >> "$GITHUB_STEP_SUMMARY"
